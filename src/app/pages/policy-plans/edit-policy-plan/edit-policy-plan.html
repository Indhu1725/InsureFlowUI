<div class="container-fluid p-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="fw-bold">
      Edit Policy Plan
    </h2>

    <button
      class="btn btn-secondary"
      routerLink="/policy-plans">

      Back

    </button>

  </div>

  <!-- Form Card -->
  <div class="card shadow-sm">

    <div class="card-body">

      <form
        [formGroup]="planForm"
        (ngSubmit)="onSubmit()">

        <div class="row">

          <!-- Product -->
          <div class="col-md-6 mb-3">

            <label class="form-label fw-semibold">

              Product

            </label>

            <select
              class="form-select"
              formControlName="productId">

              <option value="">

                Select Product

              </option>

              @for(product of products; track product.productId){

                <option [value]="product.productId">

                  {{ product.productName }}

                </option>

              }

            </select>

          </div>

          <!-- Plan Name -->
          <div class="col-md-6 mb-3">

            <label class="form-label fw-semibold">

              Plan Name

            </label>

            <input
              type="text"
              class="form-control"
              formControlName="planName">

          </div>

          <!-- Coverage Amount -->
          <div class="col-md-6 mb-3">

            <label class="form-label fw-semibold">

              Coverage Amount

            </label>

            <input
              type="number"
              class="form-control"
              formControlName="coverageAmount">

          </div>

          <!-- Premium Amount -->
          <div class="col-md-6 mb-3">

            <label class="form-label fw-semibold">

              Premium Amount

            </label>

            <input
              type="number"
              class="form-control"
              formControlName="premiumAmount">

          </div>

          <!-- Premium Type -->
          <div class="col-md-6 mb-3">

            <label class="form-label fw-semibold">

              Premium Type

            </label>

            <select
              class="form-select"
              formControlName="premiumType">

              <option [ngValue]="0">

                One Time

              </option>

              <option [ngValue]="1">

                Annual

              </option>

            </select>

          </div>

          <!-- Duration -->
          <div class="col-md-6 mb-3">

            <label class="form-label fw-semibold">

              Duration (Years)

            </label>

            <input
              type="number"
              class="form-control"
              formControlName="durationYears">

          </div>

          <!-- Terms -->
          <div class="col-12 mb-3">

            <label class="form-label fw-semibold">

              Terms & Conditions

            </label>

            <textarea
              rows="4"
              class="form-control"
              formControlName="termsAndConditions">

            </textarea>

          </div>

          <!-- Active -->
          <div class="col-12 mb-4">

            <div class="form-check">

              <input
                class="form-check-input"
                type="checkbox"
                formControlName="isActive">

              <label class="form-check-label">

                Active

              </label>

            </div>

          </div>

        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">

          <button
            type="submit"
            class="btn btn-primary">

            Update

          </button>

          <button
            type="button"
            class="btn btn-secondary"
            routerLink="/policy-plans">

            Cancel

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
