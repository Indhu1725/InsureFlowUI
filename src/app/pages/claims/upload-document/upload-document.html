<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">

      <h3 class="mb-0">Upload Document</h3>

    </div>

    <div class="card-body">

      <form (ngSubmit)="upload()">

        <!-- Claim ID -->

        <div class="mb-3">

          <label class="form-label d-flex">
            Claim ID
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <input
            type="text"
            class="form-control"
            [value]="claimId()"
            readonly>

        </div>

        <!-- Document Name -->

        <div class="mb-3">

          <label class="form-label d-flex">
            Document Name
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <input
            type="text"
            class="form-control"
            [value]="documentName()"
            (input)="onDocumentNameChange($any($event.target).value)"
            required>

        </div>

        <!-- Document Type -->

        <div class="mb-3">

          <label class="form-label d-flex">
            Document Type
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <input
            type="text"
            class="form-control"
            [value]="documentType()"
            (input)="onDocumentTypeChange($any($event.target).value)"
            required>

        </div>

        <!-- File -->

        <div class="mb-3">

          <label class="form-label d-flex">
            Choose File
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <input
            type="file"
            class="form-control"
            (change)="onFileSelected($event)"
            required>

        </div>

        <!-- Buttons -->

        <button
          type="submit"
          class="btn btn-success">

          Upload Document

        </button>

        <a
          class="btn btn-secondary ms-2"
          routerLink="/claims">

          Back

        </a>

      </form>

    </div>

  </div>

</div>
