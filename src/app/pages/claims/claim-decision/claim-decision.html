<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-success text-white">
      <h2>Claim Decision</h2>
    </div>

    <div class="card-body">

      <form (ngSubmit)="submitDecision()">

        <!-- Claim ID -->
        <div class="mb-3">

          <label class="form-label d-flex">
            Claim ID
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <input
            type="text"
            class="form-control"
            [value]="claimId()"
            readonly>

        </div>

        <!-- Final Decision -->
        <div class="mb-3">

          <label class="form-label d-flex">
            Final Decision
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <select
            class="form-select"
            [(ngModel)]="decision.finalDecisionStatus"
            name="finalDecisionStatus"
            required>

            <option [ngValue]="4">Approve</option>
            <option [ngValue]="5">Reject</option>

          </select>

        </div>

        <!-- Remarks -->
        <div class="mb-3">

          <label class="form-label d-flex">
            Remarks
            <span class="text-danger fw-bold ms-1">*</span>
          </label>

          <textarea
            rows="4"
            class="form-control"
            [(ngModel)]="decision.remarks"
            name="remarks"
            required>
          </textarea>

        </div>

        <button
          type="submit"
          class="btn btn-success me-2">

          Submit Decision

        </button>

        <button
          type="button"
          class="btn btn-secondary"
          routerLink="/claims">

          Cancel

        </button>

      </form>

    </div>

  </div>

</div>
