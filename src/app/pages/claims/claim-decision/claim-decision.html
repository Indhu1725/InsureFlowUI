<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-success text-white">

      <h2>Claim Decision</h2>

    </div>

    <div class="card-body">

      <div class="mb-3">

        <label class="form-label">

          Claim ID

        </label>

        <input
          class="form-control"
          [value]="claimId"
          readonly>

      </div>

      <div class="mb-3">

        <label class="form-label">

          Final Decision

        </label>

        <select
  class="form-select"
  [(ngModel)]="decision.finalDecisionStatus"
  name="finalDecisionStatus">

  <option [ngValue]="4">Approve</option>
  <option [ngValue]="5">Reject</option>

</select>

      </div>

      <div class="mb-3">

        <label class="form-label">

          Remarks

        </label>

        <textarea
          rows="4"
          class="form-control"
          [(ngModel)]="decision.remarks">

        </textarea>

      </div>

      <button
        class="btn btn-success me-2"
        (click)="submitDecision()">

        Submit Decision

      </button>

      <button
        class="btn btn-secondary"
        routerLink="/claims">

        Cancel

      </button>

    </div>

  </div>

</div>
