<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2>Add Customer</h2>

        </div>

        <div class="card-body">

            <div
                class="alert alert-success"
                *ngIf="successMessage">

                {{successMessage}}

            </div>

            <div
                class="alert alert-danger"
                *ngIf="errorMessage">

                {{errorMessage}}

            </div>

            <form
                [formGroup]="customerForm"
                (ngSubmit)="saveCustomer()">

                <div class="mb-3">

                    <label class="form-label">
                        Date Of Birth
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        formControlName="dateOfBirth">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <textarea
                        class="form-control"
                        rows="3"
                        formControlName="address">
                    </textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            City
                        </label>

                        <input
                            class="form-control"
                            formControlName="city">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            State
                        </label>

                        <input
                            class="form-control"
                            formControlName="state">

                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Pin Code
                        </label>

                        <input
                            class="form-control"
                            formControlName="pinCode">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Nominee Name
                        </label>

                        <input
                            class="form-control"
                            formControlName="nomineeName">

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">
                        Nominee Relation
                    </label>

                    <input
                        class="form-control"
                        formControlName="nomineeRelation">

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success me-2">

                        Save

                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        routerLink="/customers">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
