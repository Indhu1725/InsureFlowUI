<div class="container-fluid p-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Edit Profile</h2>
  </div>

  <div class="card shadow border-0">

    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Update Customer Profile</h5>
    </div>

    <div class="card-body">

      @if(customer$ | async){

      <form
        [formGroup]="editProfileForm"
        (ngSubmit)="updateProfile()">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              Date Of Birth
            </label>

            <input
              type="date"
              class="form-control"
              formControlName="dateOfBirth">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              Pin Code
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="pinCode">
          </div>

        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">
            Address
          </label>

          <textarea
            rows="3"
            class="form-control"
            formControlName="address">
          </textarea>
        </div>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              City
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="city">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              State
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="state">
          </div>

        </div>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              Nominee Name
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="nomineeName">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              Nominee Relation
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="nomineeRelation">
          </div>

        </div>

        <div class="mt-4">

          <button
            type="submit"
            class="btn btn-success me-2">
            Update Profile
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            routerLink="/customers/my-profile">
            Cancel
          </button>

        </div>

      </form>

      }

      @else{

      <div class="text-center py-5">

        <div class="spinner-border text-primary mb-3"></div>

        <h5>Loading Profile...</h5>

      </div>

      }

    </div>

  </div>

</div>
