<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">

      <h3>Issue Policy</h3>

    </div>

    <div class="card-body">

      <div class="mb-3">

        <label class="form-label">

          Customer ID

        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="issue.customerId">

      </div>

      <div class="mb-3">

        <label class="form-label">

          Plan ID

        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="issue.planId">

      </div>

      <div class="mb-3">

        <label class="form-label">

          Start Date

        </label>

        <input
          type="date"
          class="form-control"
          [(ngModel)]="issue.startDate">

      </div>

      <button
        class="btn btn-primary"
        (click)="issuePolicy()">

        Issue Policy

      </button>

    </div>

  </div>

</div>
