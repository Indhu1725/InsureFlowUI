<nav class="navbar bg-white shadow-sm px-4">

  <div>
    <i
  class="bi bi-list fs-4"
  style="cursor:pointer"
  (click)="toggleSidebar()">
</i>
  </div>

  <div class="d-flex align-items-center gap-3">

    <div class="search d-flex">

  <input
  type="text"
  class="form-control"
  placeholder="Search anything..."
  [value]="searchText()"
  (input)="searchText.set($any($event.target).value)"
  (keyup.enter)="search()">

  <button
    class="btn btn-primary ms-2"
    (click)="search()">

    <i class="bi bi-search"></i>

  </button>

</div>

    <!-- Notification -->
    <div class="position-relative">

  <i
  class="bi bi-bell-fill notification-icon"
  (click)="toggleNotifications()">
</i>

  <span
    *ngIf="notifications.length > 0"
    class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">

    {{ notifications.length }}

  </span>

  <div
    *ngIf="showNotifications"
    class="notification-dropdown shadow">

    <div class="notification-header">
      Recent Claims
    </div>

    <div
  *ngFor="let claim of notifications"
  class="notification-item"
  (click)="openNotification(claim)">

      <div class="d-flex align-items-start">

  <span class="me-2 fs-5">
    {{ claim.icon }}
  </span>

  <div>

    <strong>
      {{ claim.message }}
    </strong>

    <br>

    <small class="text-muted">
      {{ claim.date | date:'dd MMM yyyy, hh:mm a' }}
    </small>

  </div>

</div>

    </div>

    <div
      *ngIf="notifications.length === 0"
      class="notification-item">

      No Notifications

    </div>

  </div>

</div>

    <!-- Avatar -->
    <div class="position-relative">

  <img
  [src]="profileImageUrl()"
  alt="Profile"
  class="avatar"
  (click)="toggleProfileMenu()"
  style="cursor:pointer; object-fit: cover;">

  <div
    *ngIf="showProfileMenu"
    class="profile-dropdown shadow">

    <div class="profile-header">

      <strong>{{ userEmail }}</strong>

      <br>

      <small>{{ userRole }}</small>

    </div>

    <div
      class="profile-item"
      (click)="goToProfile()">

      <i class="bi bi-person me-2"></i>
      My Profile

    </div>

    <div
      class="profile-item"
      (click)="logout()">

      <i class="bi bi-box-arrow-right me-2"></i>
      Logout

    </div>

  </div>

</div>

  </div>

</nav>
